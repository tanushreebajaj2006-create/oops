spring:
  application:
    name: servicedesk-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Tests run the real Flyway migrations and Hibernate checks the entities against them,
      # so a mismatch between SQL and Java mapping fails the build instead of production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: -1

app:
  security:
    jwt-secret: test_secret_key_minimum_thirty_two_characters_long_for_unit_tests
    cors:
      allowed-origins: http://localhost:3000
