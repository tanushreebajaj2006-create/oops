spring:
  application:
    name: servicedesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${SPRING_DATASOURCE_USERNAME:servicedesk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:servicedesk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Security and CORS configuration properties
app:
  security:
    # HS256 signing key for login tokens (min 32 bytes). ALWAYS override JWT_SECRET outside development.
    jwt-secret: ${JWT_SECRET:default_jwt_secret_key_minimum_thirty_two_bytes_long}
    token-ttl: ${JWT_TTL:PT8H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Sample incidents created on first start against an empty database
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
  # Background SLA check + automatic escalation
  sla:
    monitor:
      enabled: ${APP_SLA_MONITOR_ENABLED:true}
      initial-delay: PT30S
      interval: PT60S
  notifications:
    from-address: noreply@servicedesk.example
    sms-sender-id: SVCDSK
